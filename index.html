<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-16997363114"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-16997363114');
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cargando</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #2A0087, #1a005a);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .logo {
            max-width: 180px;
            margin-bottom: 40px;
            animation: spin 4s linear infinite;
        }

        .loader {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .dot {
            width: 16px;
            height: 16px;
            background-color: #EE1750;
            border-radius: 50%;
            animation: bounce 1.2s infinite ease-in-out;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        .loading-text {
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
        }

        .dots::after {
            content: '';
            animation: dots 1.2s steps(4, end) infinite;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0.8);
                opacity: 0.5;
            }
            40% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes dots {
            0%   { content: ''; }
            25%  { content: '.'; }
            50%  { content: '..'; }
            75%  { content: '...'; }
            100% { content: ''; }
        }
    </style>
</head>
<body>
    <!-- Logo girando -->
    <img src="logo.png" alt="Logo" class="logo">

    <!-- Loader animado -->
    <div class="loader">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>

    <!-- Texto cargando con animación de puntos -->
    <div class="loading-text">
        Cargando<span class="dots"></span>
    </div>

    <script>
        window.onload = function() {
            setTimeout(function() {
                window.location.href = "";
            }, 1000);
        };
    </script>
</body>
</html>
